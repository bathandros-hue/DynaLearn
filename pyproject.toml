[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynalearn"
version = "0.1.0"
description = "Physics-grounded identification of mass-spring-damper models"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
dynalearn = "dynalearn.cli:main"

[tool.setuptools.packages.find]
include = ["dynalearn*"]
